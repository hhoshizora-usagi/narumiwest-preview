name: publish-site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Download URL of the built site (zip of index.html / company.html / contact.html)
        required: true
      sha256:
        description: Expected sha256 of the zip
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site
        env:
          SITE_URL: ${{ inputs.url }}
          SITE_SHA: ${{ inputs.sha256 }}
        run: |
          curl -fsSL -o site.zip "$SITE_URL"
          echo "$SITE_SHA  site.zip" | sha256sum -c -
          unzip -o site.zip -d .
          rm site.zip
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html company.html contact.html robots.txt .nojekyll
          git commit -m "Update site" || echo "nothing to commit"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
